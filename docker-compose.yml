version: '3.8'

services:
  # 1. MongoDB Service (เดิม)
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. RabbitMQ Service (ปรับเปลี่ยน User/Pass)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: rabbitmq

  # 3. Web Service (เดิม)
  web:
    build: ./web
    container_name: web
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=rabbitmq
    depends_on:
      - mongo
      - rabbitmq

  # 4. Scheduler Service (เพิ่มใหม่)
  scheduler:
    build: ./scheduler
    container_name: scheduler
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=rabbitmq
    depends_on:
      - mongo
      - rabbitmq

  worker:
    build: ./worker
    container_name: worker
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=rabbitmq
      - MONGO_URI=mongodb://mongo:27017/
      - DB_NAME=router_db
    depends_on:
      - rabbitmq
      - mongo

volumes:
  mongo_data:
